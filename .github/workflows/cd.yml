name: CD # Continuous Deployment

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  # -D warnings
  RUSTFLAGS: >
    -C codegen-units=1
    -C opt-level=3
    -C panic=abort
    -C strip=symbols
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash
    working-directory: src-tauri

jobs:
  upload-assets:
    name: ${{ matrix.target }}
    if: github.repository_owner == 'BrickUIApp'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable static CRT for Windows
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"
        if: endsWith(matrix.target, 'windows-msvc')

      - name: Install frontend dependencies
        run: npm ci
        working-directory: .

      - name: Build Tauri App
        run: npm run tauri build
  
      # Upload NSIS installer
      - name: Upload NSIS installer (.exe)
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe

      # Upload MSI installer
      - name: Upload MSI installer (.msi)
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/msi/*.msi