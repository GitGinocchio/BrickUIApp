[changelog]
# Render in Keep a Changelog style
header = """
# Changelog
Tutte le modifiche rilevanti a questo progetto saranno documentate in questo file.

Seguono lo stile [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)
e [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).
"""

# Footer opzionale
footer = """
"""

# Show the latest release at the top
sort = "desc"

# Which commits should be included?
# (regex allowing Angular-style Conventional Commits)
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Style" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Chore" },
    { message = "^build", group = "Build System" },
    { message = "^ci", group = "CI" },
    { body = "BREAKING CHANGE", group = "Breaking Changes" },
]

# Groups ordering
group_order = [
    "Breaking Changes",
    "Features",
    "Bug Fixes",
    "Performance",
    "Refactoring",
    "Documentation",
    "Style",
    "Testing",
    "Build System",
    "CI",
    "Chore"
]

# Keep empty groups out
strip_empty = true

# ============================================================
# Templates
# ============================================================

[changelog.templates]
# Title of a release section
# `version` and `date` come from tags generated by cargo-release
release = """
## [{{ version }}] - {{ date }}

"""

# Template for individual commits
commit = """
- {{ message | trim }} ({{ id | truncate(7, "") }})
"""

# Footer per repository changes
link = """
[{{ version }}]: https://github.com/BrickUIApp/BrickUIApp/compare/{{ previous }}...{{ version }}
"""

# ============================================================
# Repository discovery
# ============================================================

[git]
# Limit to the directory (useful for monorepos)
include = ["src-tauri"]
