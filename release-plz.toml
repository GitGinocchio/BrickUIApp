[workspace]
publish = false
repo_url = "https://github.com/BrickUIApp/BrickUIApp"
release_commits = "^(feat|fix|refactor):"
dependencies_update = true
allow_dirty = true
semver_check = false

changelog_config = "cliff.toml"
changelog_path = "CHANGELOG.md"
changelog_update = true

pr_branch_prefix = "release-plz-"
pr_name = "chore(release): {{ package }} v{{ version }}"
pr_labels = ["release"]

git_release_type = "auto"
git_release_enable = true